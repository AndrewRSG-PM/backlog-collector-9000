name: Float Check

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Default: tomorrow.'
        required: false
        default: ''
      no_mentions:
        description: 'Skip @mentions in Discord (test mode)'
        required: false
        default: 'false'
      test_mode:
        description: 'Send to test Discord webhook'
        required: false
        default: 'false'

jobs:
  float-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Float Check
        env:
          FLOAT_JWT: ${{ secrets.FLOAT_JWT }}
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          DISCORD_WEBHOOK_PROD: ${{ secrets.DISCORD_WEBHOOK_PROD }}
          DISCORD_WEBHOOK_TEST: ${{ secrets.DISCORD_WEBHOOK_TEST }}
          TARGET_DATE: ${{ inputs.date }}
          NO_MENTIONS: ${{ inputs.no_mentions }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: node scripts/float-check.js
